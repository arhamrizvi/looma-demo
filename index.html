<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Looma — Co‑working Performance Dashboard</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo_bg_removed.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="logo_bg_removed.png" />

  <!-- Meta -->
  <meta name="description" content="Looma — Live co‑working performance dashboard (SAR). Occupancy, revenue, users, and utilization in one view." />
  <meta property="og:title" content="Looma — Co‑working Performance Dashboard" />
  <meta property="og:description" content="Live demo powered by Looker Studio, wrapped in a neon‑dark shell." />
  <meta property="og:image" content="logo_bg_removed.png" />
  <meta name="color-scheme" content="dark light">

  <style>
    :root{
      --bg1:#0b1230;
      --bg2:#11183a;
      --panel:#0f1635cc;
      --text:#ecf1ff;
      --muted:#9aa3b2;
      --brand:#4cc9f0;
      --pink:#f72585;
      --purple:#b5179e;
      --gold:#D4AF37;
      --radius:16px;
      --shadow: 0 12px 30px rgba(0,0,0,.35);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;color:var(--text);
      font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      background:
        radial-gradient(1200px 800px at 20% -10%, #1b2152 0%, var(--bg1) 35%),
        radial-gradient(800px 600px at 120% 0%, #1b2152 0%, var(--bg2) 45%),
        linear-gradient(180deg, var(--bg2), var(--bg1));
    }

    .app{
      display:grid;
      grid-template-columns: 260px 1fr;
      grid-template-rows: 72px 1fr;
      grid-template-areas: "sidebar topbar" "sidebar main";
      min-height:100vh;
    }

    /* Sidebar */
    .sidebar{
      grid-area: sidebar;
      backdrop-filter: blur(6px);
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0)) , #0d1433;
      border-right:1px solid rgba(255,255,255,.06);
      padding:18px 14px;
      position:sticky; top:0; height:100vh;
    }
    .brand{
      display:flex; align-items:center; gap:12px; padding:8px 10px; margin-bottom:22px;
    }
    .brand img{height:46px; width:auto; filter:drop-shadow(0 0 12px rgba(212,175,55,.35));}
    .brand .name{font-weight:800; letter-spacing:.35px; font-size:18px}

    .nav{display:flex; flex-direction:column; gap:8px;}
    .nav a{
      color:var(--text); text-decoration:none;
      display:flex; align-items:center; gap:10px;
      padding:11px 12px; border-radius:12px;
      background: rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.06);
      transition:.2s ease;
    }
    .nav a:hover{ background: rgba(76,201,240,.10); border-color: rgba(76,201,240,.35); transform: translateY(-1px); }

    /* Topbar */
    .topbar{
      grid-area: topbar;
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 18px 14px 22px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0));
    }
    .top-left{display:flex; align-items:center; gap:12px;}
    .hamb{display:none; cursor:pointer; font-size:22px;}
    .top-title{font-weight:800; letter-spacing:.4px; font-size:18px;}
    .pills{display:flex; gap:10px; align-items:center}
    .pill{
      padding:8px 12px; border-radius:999px; font-size:12.5px;
      background: linear-gradient(90deg, rgba(76,201,240,.15), rgba(183,23,158,.15));
      border:1px solid rgba(255,255,255,.10);
    }

    /* Main */
    .main{ grid-area: main; padding:24px; }
    .panel{
      position:relative; overflow:hidden; border-radius:var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.10);
      box-shadow: var(--shadow);
    }
    /* fancy border glow */
    .panel::before{
      content:""; position:absolute; inset:-2px;
      background: conic-gradient(from 180deg at 50% 50%,
        rgba(76,201,240,.45), rgba(183,23,158,.35), rgba(181,23,158,.15), transparent 60%);
      filter: blur(18px); z-index:0; pointer-events:none;
    }
    .panel > *{ position:relative; z-index:1; }

    /* Loader */
    .loader{
      display:flex; align-items:center; justify-content:center; height:56vh;
      background: radial-gradient(560px 380px at 30% 20%, rgba(76,201,240,.10), transparent 60%);
    }
    .spin-wrap{position:relative; width:70px; height:70px;}
    .spin{
      position:absolute; inset:0; border-radius:50%;
      border:3px solid rgba(255,255,255,.15); border-top-color:var(--brand);
      animation: spin 1s linear infinite;
      filter: drop-shadow(0 0 12px rgba(76,201,240,.6));
    }
    .spin-logo{ position:absolute; inset:10px; display:grid; place-items:center; }
    .spin-logo img{ width:40px; height:auto; }

    @keyframes spin{to{transform:rotate(360deg)}}

    /* 16:9 embed */
    /* .frame{position:relative; width:100%; padding-top:56.25%;}
    .frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0;} */
    .frame {
      position: relative;
      width: 100%;
      height: calc(100vh - 120px); /* fills screen minus top bar & footer */
      max-height: 100vh;
      transition: height 0.3s ease;
    }
    .frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

     @media (max-width: 768px) {
    .frame {
      height: 100vh; /* true fullscreen on mobile */
    }
    body, html {
      height: 100%;
      overflow: hidden;
    }
    }


    .footer{ color:#9aa3b2; text-align:center; margin-top:16px; font-size:12px; }

    /* Mobile */
    @media (max-width: 900px){
      .app{ grid-template-columns: 1fr; grid-template-rows: 64px auto; grid-template-areas: "topbar" "main"; }
      .sidebar{ position:fixed; left:-100%; top:64px; height:calc(100vh - 64px); width:260px; transition:left .25s ease; z-index:10; }
      .sidebar.open{ left:0; }
      .hamb{ display:block; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand" aria-label="Looma brand">
        <img src="logo_bg_removed.png" alt="Looma logo">
        <div class="name">Looma</div>
      </div>
      <nav class="nav" aria-label="Primary">
        <a href="#overview"   data-key="overview"><span>🏠</span> <span>Overview</span></a>
        <a href="#kpis"       data-key="kpis"><span>📊</span> <span>KPIs</span></a>
        <a href="#utilization" data-key="utilization"><span>⏱</span> <span>Utilization</span></a>
        <a href="#users"      data-key="users"><span>🧑‍💻</span> <span>Users</span></a>
        <a href="#settings"   data-key="settings"><span>⚙️</span> <span>Settings</span></a>
      </nav>
    </aside>

    <header class="topbar">
      <div class="top-left">
        <div class="hamb" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Toggle menu">☰</div>
        <div class="top-title">Co‑working Performance Dashboard</div>
      </div>
      <div class="pills">
        <div class="pill">Live</div>
        <div class="pill">SAR</div>
      </div>
    </header>

    <main class="main">
      <section class="panel" aria-label="Live dashboard">
        <div id="loader" class="loader" role="status" aria-live="polite">
          <div class="spin-wrap">
            <div class="spin"></div>
            <div class="spin-logo"><img src="logo_bg_removed.png" alt=""></div>
          </div>
        </div>
        <div class="frame">
          <iframe
            src="https://lookerstudio.google.com/embed/reporting/ecca365c-5cf8-4736-8387-22e54c6e4c87/page/qODdF"
            allowfullscreen
            sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
            onload="document.getElementById('loader').style.display='none'">
          </iframe>
        </div>
      </section>
      <div class="footer">© 2025 Looma by White Space Systems</div>
    </main>
  </div>

  <script>
  // 1) Put your page IDs here (from Step 1)
  const PAGES = {
    overview:    "qODdF", // replace with your real Overview page id
    kpis:        "p_zv33720pxd", // <-- replace
    utilization: "DE34F", // <-- replace
    users:       "GH56I", // <-- replace
    settings:    "JK78L"  // <-- replace
  };

  // 2) Base embed URL of your report (everything up to /page/<id>)
  const BASE_EMBED = "https://lookerstudio.google.com/embed/reporting/ecca365c-5cf8-4736-8387-22e54c6e4c87/page/";

  const frame = document.querySelector(".frame iframe");
  const navLinks = document.querySelectorAll('.nav a');

  function setActive(key){
    navLinks.forEach(a => a.classList.toggle('active', a.dataset.key === key));
  }

  function loadPage(key){
    const pageId = PAGES[key] || PAGES.overview;
    // Show loader if you use one
    const loader = document.getElementById('loader');
    if (loader) loader.style.display = 'flex';

    frame.src = BASE_EMBED + pageId;
    setActive(key);
    // preserve deep-link so refresh keeps page
    location.hash = key;
  }

  // Click handlers
  navLinks.forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const key = a.dataset.key;
      loadPage(key);
      // close sidebar on mobile if open
      document.getElementById('sidebar')?.classList.remove('open');
    });
  });

  // On first load: open hash route or default to overview
  window.addEventListener('load', () => {
    const key = (location.hash || '#overview').replace('#','');
    loadPage(key);
  });

  // Optional: style for the active link
  const style = document.createElement('style');
  style.textContent = `
    .nav a.active{
      background: rgba(76,201,240,.18);
      border-color: rgba(76,201,240,.45);
    }
  `;
  document.head.appendChild(style);
</script>


  <script>
  function adjustFrameHeight() {
    const frame = document.querySelector('.frame');
    if (!frame) return;
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (isMobile) {
      const header = document.querySelector('.topbar')?.offsetHeight || 0;
      const footer = document.querySelector('.footer')?.offsetHeight || 0;
      const newHeight = window.innerHeight - (header + footer);
      frame.style.height = `${newHeight}px`;
    }
  }
  window.addEventListener('load', adjustFrameHeight);
  window.addEventListener('resize', adjustFrameHeight);
</script>

</body>
</html>
