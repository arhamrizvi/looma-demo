<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Looma — Co-working Performance Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Looma — Live co-working performance dashboard (SAR). Occupancy, revenue, users, and utilization in one view." />
  <meta name="color-scheme" content="dark light">
  <meta property="og:title" content="Looma — Co-working Performance Dashboard" />
  <meta property="og:description" content="Live demo powered by Looker Studio, wrapped in a neon-dark shell." />
  <meta property="og:image" content="logo_bg_removed.png" />
  <link rel="icon" type="image/png" href="logo_bg_removed.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="logo_bg_removed.png" />
  <style>
    :root{
      --bg1:#0b1230; --bg2:#11183a;
      --text:#ecf1ff; --muted:#9aa3b2;
      --brand:#4cc9f0; --pink:#f72585; --purple:#b5179e; --gold:#D4AF37;
      --radius:16px; --shadow:0 12px 30px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; color:var(--text);
      font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      background:
        radial-gradient(1200px 800px at 20% -10%, #1b2152 0%, var(--bg1) 35%),
        radial-gradient(800px 600px at 120% 0%, #1b2152 0%, var(--bg2) 45%),
        linear-gradient(180deg, var(--bg2), var(--bg1));
    }
    .app{ display:grid; grid-template-columns:260px 1fr; grid-template-rows:72px auto 1fr; grid-template-areas:"sidebar topbar" "sidebar controls" "sidebar main"; min-height:100vh; }
    .sidebar{ grid-area: sidebar; backdrop-filter: blur(6px); background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0)) , #0d1433; border-right:1px solid rgba(255,255,255,.06); padding:18px 14px; position:sticky; top:0; height:100vh; }
    .brand{ display:flex; align-items:center; gap:12px; padding:8px 10px; margin-bottom:22px; }
    .brand img{ height:46px; width:auto; filter:drop-shadow(0 0 12px rgba(212,175,55,.35)); }
    .brand .name{ font-weight:800; letter-spacing:.35px; font-size:18px }
    .nav{ display:flex; flex-direction:column; gap:8px; }
    .nav a{ color:var(--text); text-decoration:none; display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:12px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); transition:.2s ease; }
    .nav a:hover{ background:rgba(76,201,240,.10); border-color:rgba(76,201,240,.35); transform:translateY(-1px); }
    .topbar{ grid-area: topbar; display:flex; align-items:center; justify-content:space-between; padding:14px 18px 14px 22px; border-bottom:1px solid rgba(255,255,255,.06); background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0)); }
    .top-left{ display:flex; align-items:center; gap:12px; }
    .hamb{ display:none; cursor:pointer; font-size:22px; }
    .top-title{ font-weight:800; letter-spacing:.4px; font-size:18px; }
    .main{ grid-area: main; padding:24px; display:grid; gap:16px; }
    .panel{ position:relative; overflow:hidden; border-radius:var(--radius); background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02)); border:1px solid rgba(255,255,255,.10); box-shadow:var(--shadow); }
    .panel::before{ content:""; position:absolute; inset:-2px; background: conic-gradient(from 180deg at 50% 50%, rgba(76,201,240,.45), rgba(183,23,158,.35), rgba(181,23,158,.15), transparent 60%); filter: blur(18px); pointer-events:none; }
    .panel > *{ position:relative; }
    .loader{ display:flex; align-items:center; justify-content:center; height:56vh; background: radial-gradient(560px 380px at 30% 20%, rgba(76,201,240,.10), transparent 60%); }
    .spin-wrap{ position:relative; width:70px; height:70px; }
    .spin{ position:absolute; inset:0; border-radius:50%; border:3px solid rgba(255,255,255,.15); border-top-color:var(--brand); animation:spin 1s linear infinite; filter: drop-shadow(0 0 12px rgba(76,201,240,.6)); }
    .spin-logo{ position:absolute; inset:10px; display:grid; place-items:center; }
    .spin-logo img{ width:40px; height:auto; }
    @keyframes spin{ to{ transform:rotate(360deg) } }
    .frame{ position:relative; width:100%; height:calc(100vh - 120px); max-height:100vh; transition:height .3s ease; }
    .frame iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
    .footer{ color:#9aa3b2; text-align:center; margin-top:16px; font-size:12px; }
    .controls{ grid-area: controls; padding:10px 22px; display:flex; gap:10px; align-items:center; border-bottom:1px solid rgba(255,255,255,.06); flex-wrap:wrap; }
    .chip{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:8px 10px; display:flex; gap:8px; align-items:center; }
    .chip input, .chip select{ background:transparent; border:none; color:var(--text); outline:none; }
    .chip button{ background:linear-gradient(90deg, rgba(76,201,240,.35), rgba(183,23,158,.35)); border:1px solid rgba(255,255,255,.2); color:#fff; border-radius:10px; padding:8px 12px; cursor:pointer; }
    #insights { padding:16px; }
    #insights h3{ margin:0 0 8px; color:#c7d2fe; font-size:16px; }
    #insights p{ margin:0; color:#e5e7eb; white-space:pre-wrap; }
    .status-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-left:6px; vertical-align:middle; }
    .ok{ background:#10b981; }
    .bad{ background:#ef4444; }
    @media (max-width: 900px){
      .app{ grid-template-columns:1fr; grid-template-rows:64px auto auto 1fr; grid-template-areas:"topbar" "controls" "main" "main"; }
      .sidebar{ position:fixed; left:-100%; top:64px; height:calc(100vh - 64px); width:260px; transition:left .25s ease; z-index:10; }
      .sidebar.open{ left:0; }
      .hamb{ display:block; }
      .frame{ height:100vh; }
      html,body{ height:100%; overflow:hidden; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand" aria-label="Looma brand">
        <img src="logo_bg_removed.png" alt="Looma logo">
        <div class="name">Looma</div>
      </div>
      <nav class="nav" aria-label="Primary">
        <a href="#overview" data-key="overview"><span>🏠</span> <small>Overview</small></a>
        <a href="#kpis" data-key="kpis"><span>📊</span> <small>KPIs</small></a>
        <a href="#forecasts" data-key="forecasts"><span>⏱</span> <small>Forecasts</small></a>
        <a href="#users" data-key="users"><span>🧑‍💻</span> <small>Users</small></a>
        <a href="#analysis" data-key="analysis"><span>⚙️</span> <small>Analysis</small></a>
      </nav>
    </aside>

    <!-- Topbar -->
    <header class="topbar">
      <div class="top-left">
        <div class="hamb" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Toggle menu">☰</div>
        <div class="top-title">Co-working Performance Dashboard</div>
      </div>
      <div class="top-right" style="padding-right:18px;color:var(--muted);font-size:13px">
        API <span id="apiStatus" class="status-dot bad"></span>
      </div>
    </header>

    <!-- Controls -->
    <div class="controls">
      <div class="chip">From <input type="date" id="startDate"></div>
      <div class="chip">To <input type="date" id="endDate"></div>
      <div class="chip">Grain
        <select id="grain">
          <option value="M">Monthly</option>
          <option value="W">Weekly</option>
          <option value="D">Daily</option>
        </select>
      </div>
      <div class="chip">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="useLLM" checked />
          <span>Use LLM</span>
        </label>
      </div>
      <div class="chip"><button id="applyBtn">Apply</button></div>
      <small style="color:var(--muted)">Tip: keep these aligned with your Looker filters.</small>
    </div>

    <!-- Main -->
    <main class="main">

      <section class="panel" id="insights">
        <h3>AI Insights</h3>
        <p id="insight-text">Choose a date range and click Apply.</p>
      </section>

      <section class="panel" aria-label="Live dashboard">
        <div id="loader" class="loader" role="status" aria-live="polite">
          <div class="spin-wrap">
            <div class="spin"></div>
            <div class="spin-logo"><img src="logo_bg_removed.png" alt=""></div>
          </div>
        </div>
        <div class="frame">
          <iframe id="lookerFrame" src="" allow="fullscreen" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </section>

      

      <div class="footer">© 2025 Looma</div>
    </main>
  </div>

  <script>
    // ===== Existing Nav / Router =====
    const REPORTS = {
      main: { embedBase: "https://lookerstudio.google.com/embed/reporting/ecca365c-5cf8-4736-8387-22e54c6e4c87/page/" },
    };
    const ROUTES = {
      overview: { report: "main", page: "qODdF" },
      kpis:     { report: "main", page: "p_zv33720pxd" },
      forecasts:{ report: "main", page: "qODdF" },
      users:    { report: "main", page: "qODdF" },
      analysis: { report: "main", page: "qODdF" },
    };
    const frame  = document.getElementById("lookerFrame");
    const loader = document.getElementById("loader");
    const navLinks = document.querySelectorAll(".nav a");
    function setActive(key){ navLinks.forEach(a => a.classList.toggle("active", a.dataset.key === key)); }
    function buildEmbedUrl(key){ const route = ROUTES[key] || ROUTES.overview; return REPORTS[route.report].embedBase + route.page; }
    function adjustFrameHeight(){
      const header = document.querySelector('.topbar')?.offsetHeight || 0;
      const footer = document.querySelector('.footer')?.offsetHeight || 0;
      const h = Math.max(320, window.innerHeight - (header + footer) - 140);
      frame.parentElement.style.height = h + 'px';
    }
    function go(key){
      setActive(key);
      const url = buildEmbedUrl(key);
      if (loader) loader.style.display = "flex";
      frame.src = url;
      let first = true;
      frame.onload = () => { if (first && loader) loader.style.display = "none"; first = false; };
      setTimeout(() => { if (loader && loader.style.display !== "none") frame.src = url; }, 15000);
    }
    navLinks.forEach(a => a.addEventListener("click", e => { e.preventDefault(); const key=a.dataset.key; location.hash=key; go(key); document.getElementById('sidebar')?.classList.remove('open'); }));
    window.addEventListener("resize", adjustFrameHeight);
    window.addEventListener("load", () => { adjustFrameHeight(); const key=(location.hash||"#overview").slice(1); go(key); });

    (function(){ const style=document.createElement("style"); style.textContent=`.nav a.active{ background: rgba(76,201,240,.18); border-color: rgba(76,201,240,.45); }`; document.head.appendChild(style); })();

    // ===== New: Insights wiring =====
    // For local testing keep localhost. For Netlify testing, replace with your ngrok/Cloudflare tunnel URL.
    //const API_BASE = "http://localhost:8000";

    const API_BASE = "https://looma-insights-api-62287712383.asia-south1.run.app";

    const startInput = document.getElementById('startDate');
    const endInput   = document.getElementById('endDate');
    const grainSel   = document.getElementById('grain');
    const applyBtn   = document.getElementById('applyBtn');
    const insightEl  = document.getElementById('insight-text');
    const useLLMChk  = document.getElementById('useLLM');
    const apiStatus  = document.getElementById('apiStatus');

    // sensible defaults (last 90 days)
    const today = new Date();
    const startDefault = new Date(today); startDefault.setMonth(today.getMonth()-2, 1);
    startInput.value = startDefault.toISOString().slice(0,10);
    endInput.value   = today.toISOString().slice(0,10);

    async function pingAPI(){
      try{
        const r = await fetch(`${API_BASE}/health`, {cache:'no-store'});
        if(r.ok){ apiStatus.classList.remove('bad'); apiStatus.classList.add('ok'); }
        else { apiStatus.classList.remove('ok'); apiStatus.classList.add('bad'); }
      }catch(e){
        apiStatus.classList.remove('ok'); apiStatus.classList.add('bad');
      }
    }

    async function summarizeFromDB(){
      insightEl.textContent = "Analyzing trends…";
      const params = new URLSearchParams({
        start_date: startInput.value,
        end_date: endInput.value,
        grain: grainSel.value,
        llm: useLLMChk.checked ? 'true' : 'false'
      });
      try{
        const r = await fetch(`${API_BASE}/summarize_from_db?${params.toString()}`);
        const j = await r.json();
        if(!r.ok){
          insightEl.textContent = j?.detail ? `Error: ${j.detail}` : "API error.";
          return;
        }
        insightEl.textContent = j.text || "No insights generated.";
      }catch(e){
        console.error(e);
        insightEl.textContent = "Could not generate insights (network error).";
      }
    }

    function maybeUpdateReportParams(){
      // If your Looker Studio report supports URL parameters, update here.
      // Example: frame.src = buildEmbedUrl((location.hash||"#overview").slice(1)) + `?params=start=${startInput.value},end=${endInput.value}`;
    }

    applyBtn.addEventListener('click', async () => {
      maybeUpdateReportParams();
      await summarizeFromDB();
    });

    // initial ping
    pingAPI();
  </script>
</body>
</html>
