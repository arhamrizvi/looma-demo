<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Looma — Demo Dashboard</title>
  <link rel="icon" type="image/png" href="logo_bg_removed.png" />
  <meta name="color-scheme" content="dark light">
  <style>
    :root{
      --bg1:#0b1230;
      --bg2:#131a3a;
      --panel:#141c3f;
      --panel-2:#0f1635;
      --text:#e6e9f2;
      --muted:#98a2b3;
      --brand:#4cc9f0;        /* cyan accent */
      --brand-2:#f72585;      /* pink accent */
      --brand-3:#b5179e;      /* purple accent */
      --accent:#D4AF37;       /* gold for logo glow */
      --card-glow: 0 10px 30px rgba(76,201,240,.15);
      --radius:16px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--text);
      font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      background: radial-gradient(1200px 800px at 20% -10%, #1b2152 0%, var(--bg1) 30%),
                  radial-gradient(900px 700px at 120% 0%, #1b2152 0%, var(--bg2) 40%),
                  linear-gradient(180deg, var(--bg2), var(--bg1));
    }
    .app{
      display:grid;
      grid-template-columns: 240px 1fr;
      grid-template-rows: 72px 1fr;
      grid-template-areas:
        "sidebar topbar"
        "sidebar main";
      min-height:100vh;
    }
    /* Sidebar */
    .sidebar{
      grid-area: sidebar;
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0)) , var(--panel-2);
      border-right:1px solid rgba(255,255,255,.06);
      padding:18px 14px;
    }
    .brand{
      display:flex;align-items:center;gap:12px;padding:8px 10px;margin-bottom:22px;
    }
    .brand img{height:42px;width:auto;filter: drop-shadow(0 0 12px rgba(212,175,55,.35));}
    .brand .name{font-weight:700;letter-spacing:.3px}
    .nav{
      display:flex;flex-direction:column;gap:8px;margin-top:8px;
    }
    .nav a{
      color:var(--text);text-decoration:none;
      padding:10px 12px;border-radius:12px;
      display:flex;align-items:center;gap:10px;
      background: rgba(255,255,255,.02);
      border:1px solid rgba(255,255,255,.05);
    }
    .nav a:hover{background: rgba(76,201,240,.08); border-color: rgba(76,201,240,.25);}
    .nav small{color:var(--muted)}
    /* Topbar */
    .topbar{
      grid-area: topbar;
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 18px 14px 22px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0));
    }
    .top-title{font-weight:700;letter-spacing:.4px}
    .pills{display:flex;gap:10px;align-items:center}
    .pill{
      padding:8px 12px;border-radius:999px;
      background: linear-gradient(90deg, rgba(76,201,240,.15), rgba(183,23,158,.15));
      border:1px solid rgba(255,255,255,.08);
      color:var(--text);font-size:13px;
    }
    /* Main */
    .main{
      grid-area: main;
      padding:24px;
    }
    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.08);
      border-radius: var(--radius);
      box-shadow: var(--card-glow);
      overflow:hidden;
    }
    /* Loader */
    .loader{
      position:relative;display:flex;align-items:center;justify-content:center;
      height:60vh;background: radial-gradient(600px 400px at 30% 20%, rgba(76,201,240,.10), transparent 60%);
    }
    .spinner{
      width:46px;height:46px;border-radius:50%;
      border:3px solid rgba(255,255,255,.15);
      border-top-color: var(--brand);
      animation: spin 1s linear infinite;
      filter: drop-shadow(0 0 12px rgba(76,201,240,.6));
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    /* Responsive iframe wrapper 16:9 */
    .frame{position:relative;width:100%;padding-top:56.25%;}
    .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
    /* Hide loader when iframe loaded */
    .hidden{display:none !important;}
    /* Footer */
    .footer{color:#9aa3b2;text-align:center;margin-top:16px;font-size:12px;}
    @media (max-width: 880px){
      .app{grid-template-columns: 80px 1fr;}
      .brand .name{display:none}
      .nav small{display:none}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="logo_bg_removed.png" alt="Looma logo">
        <div class="name">Looma</div>
      </div>
      <nav class="nav">
        <a href="#"><span>🏠</span> <small>Overview</small></a>
        <a href="#"><span>📊</span> <small>KPIs</small></a>
        <a href="#"><span>⏱</span> <small>Utilization</small></a>
        <a href="#"><span>🧑‍💻</span> <small>Users</small></a>
        <a href="#"><span>⚙️</span> <small>Settings</small></a>
      </nav>
    </aside>

    <header class="topbar">
      <div class="top-title">Co‑working Performance Dashboard</div>
      <div class="pills">
        <div class="pill">Live</div>
        <div class="pill">SAR</div>
      </div>
    </header>

    <main class="main">
      <section class="panel">
        <div id="loader" class="loader">
          <div class="spinner"></div>
        </div>
        <div class="frame">
          <iframe
            src="https://lookerstudio.google.com/embed/reporting/ecca365c-5cf8-4736-8387-22e54c6e4c87/page/qODdF"
            allowfullscreen
            sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
            onload="document.getElementById('loader').classList.add('hidden')">
          </iframe>
        </div>
      </section>
      <div class="footer">© 2025 Looma by White Space Systems</div>
    </main>
  </div>
</body>
</html>
